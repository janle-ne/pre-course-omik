<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ME Flashcards – Lý thuyết</title>
<style>
:root{--bg:#f8fafc;--tx:#111827;--card:#fff;--ac:#1d4ed8;--bd:#cbd5e1;--mu:#64748b;--back:#eff6ff}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--tx:#e5e7eb;--card:#1e293b;--ac:#60a5fa;--bd:#334155;--mu:#94a3b8;--back:#172554}}
body{font:16px/1.5 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx);margin:0;padding:12px}
.w{max-width:720px;margin:auto}h1{font-size:20px;color:var(--ac);margin:4px 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}select,button{font:inherit;padding:7px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{min-height:280px;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:22px;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.card.b{background:var(--back);border-color:var(--ac)}
.tp{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.q{font-size:21px;font-weight:600}.a{font-size:18px}.n{margin-top:12px;color:var(--mu);font-size:14px}
.st{display:flex;justify-content:space-between;color:var(--mu);font-size:14px;margin:8px 2px}
.hint{text-align:center;color:var(--mu);font-size:13px;margin-top:6px}
</style></head><body><div class="w"><h1>Managerial Economics – Flashcards lý thuyết</h1>
<div class="bar"><select id="f"><option value="all">Tất cả chủ đề</option><option>1. Market &amp; Competition</option><option>2. Lean Startup</option><option>3. Business Proposal</option><option>4. Financial Strategy</option><option>5. Organizations, M&amp;A, Alliances</option></select>
<select id="m"><option value="all">Tất cả thẻ</option><option value="rev">Chỉ thẻ chưa thuộc</option></select>
<button id="sh">Xáo trộn</button><button id="rs">Làm lại</button></div>
<div class="st"><span id="pos"></span><span id="kn"></span></div>
<div class="card" id="c"></div><div class="hint">Bấm vào thẻ để lật · phím ←/→ chuyển thẻ · Space lật</div>
<div class="bar" style="margin-top:12px;justify-content:center"><button id="pv">← Trước</button><button id="no">Chưa thuộc</button><button id="ok" class="p">Đã thuộc ✓</button><button id="nx">Sau →</button></div></div>
<script>
const ALL=[{"t": "1. Market & Competition", "q": "Survival of the fittest (Darwin) – what does it mean for firms?", "a": "Survival depends on the ability to adapt to change, not on being the strongest. Firms that fail to adapt to competition, technology or regulation disappear.", "n": "Dùng làm câu mở bài cho essay về competition."}, {"t": "1. Market & Competition", "q": "What is the Liability of Newness (Stinchcombe)? List the 5 gaps.", "a": "New firms have the highest mortality in early years. Gaps: (1) lack of experience; (2) lack of coordination; (3) precarious trust relationships; (4) lack of customers; (5) external socioeconomic macro structures (market, regulatory, institutional barriers).", "n": "Trả lời câu 'Why do startups fail?'."}, {"t": "1. Market & Competition", "q": "Who are competitors in output markets?", "a": "Firms selling (close) substitutes – products with similar performance characteristics.", "n": ""}, {"t": "1. Market & Competition", "q": "Name the 4 market structures.", "a": "Competitive market, monopoly, monopolistic competition, oligopoly.", "n": "Nhớ theo phổ: nhiều người bán → một người bán."}, {"t": "1. Market & Competition", "q": "Competitive market: features + example", "a": "Many sellers, homogeneous products, very price-sensitive; price ≈ marginal cost; excess capacity pushes price lower. Example: Airbnb hosts.", "n": ""}, {"t": "1. Market & Competition", "q": "Monopoly: features + example", "a": "One dominant seller who ignores fringe firms; price far above marginal cost without losing much business. Example: Google Search (2010s).", "n": ""}, {"t": "1. Market & Competition", "q": "Monopolistic competition: features + example", "a": "Many sellers, differentiated products; some loyal customers; price depends on willingness to switch; profits eroded by entrants. Example: Zara vs H&M.", "n": ""}, {"t": "1. Market & Competition", "q": "Oligopoly: features + example", "a": "Few firms; each decision affects rivals; price is high (collusion) or near cost (price war). Example: Coca-Cola vs Pepsi.", "n": "Dẫn đến game theory."}, {"t": "1. Market & Competition", "q": "What is game theory?", "a": "The study of how one firm's decision affects its rivals' decisions (like chess: every move may trigger a counter-move).", "n": ""}, {"t": "1. Market & Competition", "q": "Define Nash equilibrium.", "a": "A stable outcome where no player can improve by changing strategy alone.", "n": "Ổn định, nhưng chưa chắc tốt nhất."}, {"t": "1. Market & Competition", "q": "Define Pareto optimal outcome.", "a": "The best collective outcome for all players together.", "n": "Dễ nhầm với Nash!"}, {"t": "1. Market & Competition", "q": "Prisoner's dilemma – define + examples", "a": "Both could cooperate and benefit, but the temptation to betray leads to a worse outcome for both. Examples: Airbus–Boeing; Vietnam Airlines–VietJet.", "n": ""}, {"t": "1. Market & Competition", "q": "How do you find a Nash equilibrium (3 steps)?", "a": "(1) For each rival action, find your best response. (2) Check if one action is always best (dominant strategy). (3) Repeat for the other player; the cell where both play best responses is Nash.", "n": ""}, {"t": "1. Market & Competition", "q": "Airbus–Boeing payoff matrix: results (€m)", "a": "Both hold = (500, 500) Pareto optimal. Airbus cuts, Boeing holds = (700, 100). Airbus holds, Boeing cuts = (100, 700). Both cut = (300, 300) Nash. Total profit falls from 1,000 to 600.", "n": ""}, {"t": "1. Market & Competition", "q": "What are the morals of the prisoner's dilemma and how can firms escape it?", "a": "Destructive competition = lose–lose; cooperation = win–win in the long term. Escape by differentiation, loyalty/switching costs, repeated games and reputation.", "n": "Collusion thường bất hợp pháp."}, {"t": "1. Market & Competition", "q": "Entry decision rule", "a": "A firm enters if expected post-entry profits > sunk costs of entry. Entry barriers reduce entry.", "n": ""}, {"t": "1. Market & Competition", "q": "Exit decision rule", "a": "A firm exits if expected future losses > sunk costs of exit.", "n": ""}, {"t": "1. Market & Competition", "q": "Entry/exit statistic from the slides", "a": "In a typical industry, one-third of firms are younger than 5 years and one-third will exit within 5 years.", "n": ""}, {"t": "1. Market & Competition", "q": "Make or buy?", "a": "Decide which activities in the vertical chain to do yourself and which to buy from the market, by comparing benefits and costs of using the market (most efficient production).", "n": "Ví dụ: franchise = buy."}, {"t": "1. Market & Competition", "q": "Define competitive advantage.", "a": "A firm earns higher profitability than rivals; depends on industry conditions and the value the firm creates compared with rivals.", "n": ""}, {"t": "1. Market & Competition", "q": "Consumer surplus formula", "a": "CS = perceived benefit (B) – price (P). A consumer buys only if CS > 0 and chooses the seller offering the highest CS.", "n": ""}, {"t": "1. Market & Competition", "q": "Value created formula", "a": "Value created = B – unit cost (C) = CS + economic profit (P – C).", "n": ""}, {"t": "1. Market & Competition", "q": "Two conditions for competitive advantage", "a": "Create positive value AND create more value than rivals.", "n": ""}, {"t": "1. Market & Competition", "q": "The 4 generic strategies", "a": "Cost leadership (VietJet Air), benefit leadership (Highlands Coffee), focus (Rolex), hybrid (Singapore Airlines).", "n": ""}, {"t": "1. Market & Competition", "q": "What are isolating mechanisms?", "a": "Factors that prevent rivals from duplicating or neutralizing the source of advantage: barriers to imitation and early-mover advantages.", "n": ""}, {"t": "1. Market & Competition", "q": "Barriers to imitation (4 types + examples)", "a": "A) legal restrictions (Vinamilk); B) superior access to scarce inputs/customers (Vingroup land); C) economies of scale + limited market size (Samsung); D) intangible barriers (Coca-Cola's century-old distribution network).", "n": ""}, {"t": "1. Market & Competition", "q": "Early-mover advantages (4 types + examples)", "a": "A) learning curve (VinFast EV know-how); B) brand reputation (Ferrari); C) consumer switching costs (Vietcombank linked cards); D) network effects (Zalo).", "n": ""}, {"t": "1. Market & Competition", "q": "Creative destruction (Schumpeter)", "a": "Old advantages are destroyed or replaced by new ones; entrepreneurship = exploiting 'shocks' or discontinuities.", "n": "Giới hạn của lợi thế cạnh tranh."}, {"t": "2. Lean Startup", "q": "Why do business proposals fail? (chart figures)", "a": "No market need 42%; ran out of cash 29%; not the right team 23%; get outcompeted 19%; pricing/cost issues 18%. About 9 out of 10 proposals fail.", "n": ""}, {"t": "2. Lean Startup", "q": "The main reason proposals fail", "a": "They build something nobody wants – it does not matter if they do it on time and on budget.", "n": ""}, {"t": "2. Lean Startup", "q": "Lean Startup: Adaptation", "a": "Successful founders have the ability and tools to discover which parts of their plan work and adapt. The goal is to build what customers want and will pay for.", "n": ""}, {"t": "2. Lean Startup", "q": "Lean Startup: Validation", "a": "Learning is the essential unit of progress. Effort not needed to learn what customers want can be eliminated. Validation = positive improvement in core metrics using empirical data from real or potential customers.", "n": ""}, {"t": "2. Lean Startup", "q": "'An experiment is a product' – meaning?", "a": "An experiment is more than a theoretical inquiry: if successful, it collects early adopters and starts the real product, which will already have customers when launched.", "n": ""}, {"t": "2. Lean Startup", "q": "Build–Measure–Learn loop", "a": "Ideas → Build → Product → Measure → Data → Learn. Build an artifact to test a hypothesis; measure its performance; learn by comparing with the hypothesis.", "n": ""}, {"t": "2. Lean Startup", "q": "What is an MVP?", "a": "Minimum Viable Product: a basic version of the product/service (or an experiment) built to test a hypothesis.", "n": "MVP không phải sản phẩm kém."}, {"t": "2. Lean Startup", "q": "Persevere vs pivot", "a": "Hypothesis true → persevere. Hypothesis false → pivot.", "n": ""}, {"t": "2. Lean Startup", "q": "Define pivot", "a": "A structured course correction to test a new fundamental hypothesis about the product/service; requires a new MVP.", "n": ""}, {"t": "2. Lean Startup", "q": "What is a Call To Action (CTA)? Examples", "a": "An action used in an experiment to test a hypothesis, at different investment levels: click a button/answer a survey → give a personal e-mail → make a purchase.", "n": ""}, {"t": "2. Lean Startup", "q": "Landing page and its key metric", "a": "A single web page/simple site describing a value proposition. Key learning metric = conversion rate (visitors → people performing the CTA).", "n": ""}, {"t": "2. Lean Startup", "q": "3 sections of a landing page", "a": "1) Homepage: headline speaking to customers + value proposition. 2) Product/service description (what, how, for whom). 3) Call to Action. Optional: FAQs/additional information to build trust.", "n": ""}, {"t": "2. Lean Startup", "q": "Test Card (Strategyzer): 4 steps", "a": "1) Hypothesis (We believe that…). 2) Test (To verify that, we will…). 3) Metric (And measure…). 4) Criteria (We are right if…).", "n": ""}, {"t": "2. Lean Startup", "q": "Grading example – in-campus food delivery app", "a": "Satisfactory/Average Good: 1 business proposal (clear problem + viable solution). Good/Very Good: + 1 market survey with contacts of interested students and canteens. Very Good/Excellent: + 1 working MVP app with one canteen/university acquired.", "n": ""}, {"t": "3. Business Proposal", "q": "What is a business proposal? Purposes", "a": "A detailed plan to set up a business. Purposes: (1) attract funding and resources; (2) make the idea clear and organized.", "n": ""}, {"t": "3. Business Proposal", "q": "The 8 parts of the pitch", "a": "1 Problem; 2 Solution; 3 Business/revenue model; 4 Market & competitors; 5 Marketing & sales; 6 Team; 7 Fundraising; 8 Roadmap & metrics.", "n": ""}, {"t": "3. Business Proposal", "q": "TAM, SAM, SOM", "a": "TAM = total potential market; SAM = segment you can target; SOM = realistic share you can win.", "n": ""}, {"t": "3. Business Proposal", "q": "Business Model Canvas – 9 blocks", "a": "Customer segments, value proposition, channels, customer relationships, revenue streams, key resources, key activities, key partnerships, cost structure.", "n": ""}, {"t": "3. Business Proposal", "q": "BMC: Customer segments & Value proposition", "a": "Segments = groups of people/organizations to serve (segment by needs, behaviors). Value proposition = bundle of products/services that solves a need; why customers choose you.", "n": ""}, {"t": "3. Business Proposal", "q": "BMC: Channels, Customer relationships, Revenue streams", "a": "Channels = how you communicate and deliver (own, partner, mix). Relationships = acquisition, retention, upselling. Revenue = cash from each segment; transaction (one-time) vs recurring.", "n": ""}, {"t": "3. Business Proposal", "q": "BMC: Key resources, activities, partnerships, costs", "a": "Resources = most important assets. Activities = most important things to do. Partnerships = suppliers/partners (optimize, reduce risk, acquire resources). Costs = fixed, variable, economies of scale and scope.", "n": ""}, {"t": "3. Business Proposal", "q": "Porter's Five Forces – list", "a": "Rivalry among competitors; threat of new entrants; threat of substitutes; bargaining power of buyers; bargaining power of suppliers. The stronger the forces, the harder to make profit.", "n": ""}, {"t": "3. Business Proposal", "q": "Rivalry increases when…", "a": "High concentration and balance, high industry growth, high fixed costs, high exit barriers, low differentiation.", "n": ""}, {"t": "3. Business Proposal", "q": "Threat of new entrants depends on…", "a": "Entry barriers: scale and experience, access to supply/distribution, expected retaliation, legislation, incumbency advantages. Low barriers = high threat.", "n": ""}, {"t": "3. Business Proposal", "q": "Substitutes and buyer power", "a": "Substitutes: price/performance ratio, extra-industry effects. Buyer power rises with concentrated buyers, low switching costs, threat of buyers competing, low buyer profits/quality impact.", "n": ""}, {"t": "3. Business Proposal", "q": "Supplier power increases when…", "a": "Suppliers are concentrated, switching costs are high, suppliers can compete with the firm, or products are differentiated.", "n": ""}, {"t": "3. Business Proposal", "q": "SWOT definition", "a": "Strengths (internal advantages), Weaknesses (internal limits), Opportunities (external favorable), Threats (external risks). Goal: connect internal resources with the external environment.", "n": ""}, {"t": "3. Business Proposal", "q": "TOWS matrix: 4 strategies", "a": "SO: use strengths to capture opportunities. WO: overcome weaknesses using opportunities. ST: use strengths to counter threats. WT: minimize weaknesses and avoid threats.", "n": ""}, {"t": "4. Financial Strategy", "q": "Companies vs startups", "a": "Companies follow established processes, focus on long-term sustainability and incremental growth. Startups search for a repeatable, scalable business model; innovation, experimentation, high uncertainty → riskier, depend more on investors.", "n": ""}, {"t": "4. Financial Strategy", "q": "What do investors want?", "a": "Investors give money for equity; take high-risk ventures for high returns; many seek 5–10x their investment over 5 years.", "n": ""}, {"t": "4. Financial Strategy", "q": "Business angels vs VC vs PE", "a": "Angels: private individuals, early stage, smaller amounts. VC: large firms, startups with high growth potential, minority stakes. PE: large firms, mature companies, majority stakes to improve performance and value.", "n": ""}, {"t": "4. Financial Strategy", "q": "Incubators vs accelerators", "a": "Incubators: nonprofit/university, space + infrastructure + advice for a fee (usually not equity). Accelerators: fixed 3–6 months, same services + seed investment for equity, end with demo day/pitch event.", "n": ""}, {"t": "4. Financial Strategy", "q": "Crowdfunding", "a": "Online platforms where many people make small contributions to projects/startups; backers often get rewards or equity.", "n": ""}, {"t": "4. Financial Strategy", "q": "The 4 phases of the business lifecycle", "a": "1) Start-up (capital?) 2) Growth (management?) 3) Maturity (new growth?) 4) Exit (route?) → then serial entrepreneurship (ideas?).", "n": ""}, {"t": "4. Financial Strategy", "q": "Start-up phase: 'Valley of Death'", "a": "Founders use their own money (bootstrapping) and raise funds from family, friends and fools (FFF); accelerators and incubators play a crucial role.", "n": ""}, {"t": "4. Financial Strategy", "q": "Growth & maturity phases: who funds?", "a": "Large investment firms (VC or PE). Founders must pick those who give capital and professional services; investors must choose which business plans to fund.", "n": ""}, {"t": "4. Financial Strategy", "q": "Exit: IPO vs M&A", "a": "IPO: shares sold to institutional investors who sell to the public on an exchange for the first time. M&A: ownership transferred or combined; both consolidate assets under one entity.", "n": ""}, {"t": "4. Financial Strategy", "q": "Lifecycle table: start-up and growth", "a": "Start-up: funding high, cost of capital high, risk high; personal debt, angel/VC equity; dividends zero. Growth: funding high, cost medium, risk high; debentures + growth-investor equity; dividends nominal.", "n": ""}, {"t": "4. Financial Strategy", "q": "Lifecycle table: maturity and exit/decline", "a": "Maturity: funding low/medium, cost low/medium, risk low/medium; debt, equity, retained earnings; dividends high. Exit/Decline: funding low/negative, cost medium/high, risk medium; debt, retained earnings; dividends high.", "n": ""}, {"t": "4. Financial Strategy", "q": "Lifecycle examples from slides", "a": "Start-up: Grab. Growth: Airbnb (VC). Mature: Apple (corporate bonds for R&D). Exit/Decline: WhatsApp acquired by Facebook; Nokia sold smartphone division to Microsoft.", "n": ""}, {"t": "4. Financial Strategy", "q": "ROCE – formula and example", "a": "ROCE = profit before interest and tax ÷ capital employed. Example: €1M ÷ €10M = 10%.", "n": ""}, {"t": "4. Financial Strategy", "q": "Payback period – formula and example", "a": "Payback = initial investment ÷ annual cash inflow. Example: €10M ÷ €2M = 5 years.", "n": ""}, {"t": "4. Financial Strategy", "q": "NPV (DCF) – formula and example", "a": "NPV = Σ cash inflow ÷ (1+r)^n – initial investment (r = discount rate, n = years). Example: €2M in 2 years at 10% = 2 ÷ 1.21 = €1.65M.", "n": ""}, {"t": "4. Financial Strategy", "q": "Which financial return method is best and why?", "a": "NPV: it discounts all cash flows. Payback ignores cash after payback and time value; ROCE ignores timing.", "n": ""}, {"t": "4. Financial Strategy", "q": "Funding rounds and dilution (chart)", "a": "Idea (50/50 founders) → family & friends ($15k) → seed ($200k at $1M valuation) → Series A ($2M at $4M) → IPO ($25M at $250M). Founders' stakes are diluted at each round.", "n": ""}, {"t": "5. Organizations, M&A, Alliances", "q": "Functional structure", "a": "Divides by specialist roles (production, R&D, sales).", "n": ""}, {"t": "5. Organizations, M&A, Alliances", "q": "Functional: advantages", "a": "CEO in touch with all operations (Tesla); simple control (Vinamilk); clear responsibilities (Viettel); specialists in senior roles (Pfizer R&D).", "n": ""}, {"t": "5. Organizations, M&A, Alliances", "q": "Functional: disadvantages", "a": "Seniors overburdened by routine (early Microsoft); neglect of strategy (Kodak); hard to cope with diversity (Trung Nguyên); poor coordination (Sony); failure to adapt (Nokia).", "n": ""}, {"t": "5. Organizations, M&A, Alliances", "q": "Multidivisional structure + advantages", "a": "Divisions by product, service or geography. Advantages: flexible (Vingroup/VinFast), control by performance (GE), ownership of strategy (Samsung), specialization (Sabeco), strategic-view training (P&G).", "n": ""}, {"t": "5. Organizations, M&A, Alliances", "q": "Multidivisional: disadvantages", "a": "Duplication of functions (Vingroup); fragmentation/non-cooperation (VW, Audi, Porsche); loss of central control (EVN).", "n": ""}, {"t": "5. Organizations, M&A, Alliances", "q": "Matrix structure + advantages", "a": "Combines two dimensions at once (e.g., product × region). Advantages: integrates knowledge (Viettel), flexibility (Philips), dual dimensions (Nestlé).", "n": ""}, {"t": "5. Organizations, M&A, Alliances", "q": "Matrix: disadvantages", "a": "Slow decisions (Airbus); unclear roles (Nestlé); unclear cost/profit responsibility (Accenture); conflict (BIDV IT vs branches).", "n": ""}, {"t": "5. Organizations, M&A, Alliances", "q": "Network structure", "a": "Relationships among individuals/teams/firms rather than hierarchy. Pros: high flexibility and adaptability. Cons: confusion, conflicts, unclear roles (Apple App Store developers).", "n": ""}, {"t": "5. Organizations, M&A, Alliances", "q": "Merger vs acquisition", "a": "Merger: two organizations combine into a new company (Southern Bank–Sacombank 2015). Acquisition: buying a majority of shares; friendly or hostile (Microsoft–LinkedIn 2016).", "n": ""}, {"t": "5. Organizations, M&A, Alliances", "q": "Strategic reasons for M&A", "a": "Extension (Vingroup–VinEco); consolidation (Viettel absorbing EVN Telecom); capabilities (Cisco buying startups, AppDynamics).", "n": ""}, {"t": "5. Organizations, M&A, Alliances", "q": "Financial reasons for M&A", "a": "Financial efficiency (Vietcombank absorbing weak banks); tax efficiency (Pfizer–Allergan); asset stripping/unbundling (KKR).", "n": ""}, {"t": "5. Organizations, M&A, Alliances", "q": "Managerial reasons for M&A", "a": "Serve managers more than shareholders: personal ambition (Vodafone–Mannesmann = hubris); bandwagon effects (telecoms in the dot-com bubble).", "n": "Nhớ S-F-M."}, {"t": "5. Organizations, M&A, Alliances", "q": "The 3 stages of M&A process", "a": "1) Target choice (strategic fit + organizational fit). 2) Negotiation (too low = fails; too high = never recovers cost, e.g., RBS–ABN AMRO). 3) Integration.", "n": ""}, {"t": "5. Organizations, M&A, Alliances", "q": "Five types of post-merger integration", "a": "Absorption (tight, low autonomy – Google/Android); preservation (autonomy); symbiosis (mutual learning – Disney/Pixar); intensive care (target in trouble – KKR); reorientation (healthy but needs alignment – VinFast restructuring).", "n": ""}, {"t": "5. Organizations, M&A, Alliances", "q": "Strategic alliance – definition", "a": "Two or more organizations share resources/activities to pursue a common strategy without full ownership change.", "n": ""}, {"t": "5. Organizations, M&A, Alliances", "q": "Equity vs non-equity alliances", "a": "Equity: joint ventures, consortiums (Sematech). Non-equity: franchising (McDonald's), licensing (Lego–Star Wars), long-term subcontracting (Magna).", "n": ""}, {"t": "5. Organizations, M&A, Alliances", "q": "Reasons for alliances", "a": "Scale (Techcombank & Masan), access (Grab & Moca), complementary resources (Viettel & Qualcomm 5G), collusive (OPEC – often illegal).", "n": ""}, {"t": "5. Organizations, M&A, Alliances", "q": "Alliance process", "a": "Courtship → negotiation → start-up (high early failure risk) → maintenance → termination. Mutual trust is vital so partners can co-evolve.", "n": ""}];
let known=new Set(),deck=[],i=0,flip=false;
const $=id=>document.getElementById(id);
function build(keep){const f=$('f').value,m=$('m').value;deck=ALL.map((c,k)=>({...c,k})).filter(c=>(f==='all'||c.t===f)&&(m==='all'||!known.has(c.k)));if(!keep)i=0;if(i>=deck.length)i=0;flip=false;show()}
function show(){const c=deck[i];$('kn').textContent='Đã thuộc: '+known.size+'/'+ALL.length;
if(!c){$('c').className='card';$('c').innerHTML='<div class="q">Không còn thẻ trong bộ lọc này 🎉</div>';$('pos').textContent='0/0';return}
$('pos').textContent=(i+1)+' / '+deck.length;$('c').className='card'+(flip?' b':'');
const e=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
$('c').innerHTML='<div class="tp">'+e(c.t)+(known.has(c.k)?' · ✓':'')+'</div>'+(flip?'<div class="a">'+e(c.a)+'</div>'+(c.n?'<div class="n">💡 '+e(c.n)+'</div>':''):'<div class="q">'+e(c.q)+'</div>')}
function go(d){if(!deck.length)return;i=(i+d+deck.length)%deck.length;flip=false;show()}
$('c').onclick=()=>{flip=!flip;show()};$('nx').onclick=()=>go(1);$('pv').onclick=()=>go(-1);
$('ok').onclick=()=>{if(deck[i]){known.add(deck[i].k);if($('m').value==='rev')build(true);else go(1)}};
$('no').onclick=()=>{if(deck[i]){known.delete(deck[i].k);go(1)}};
$('f').onchange=()=>build();$('m').onchange=()=>build();
$('sh').onclick=()=>{for(let a=deck.length-1;a>0;a--){const b=Math.floor(Math.random()*(a+1));[deck[a],deck[b]]=[deck[b],deck[a]]}i=0;flip=false;show()};
$('rs').onclick=()=>{known.clear();$('f').value='all';$('m').value='all';build()};
document.onkeydown=e=>{if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);else if(e.key===' '){e.preventDefault();flip=!flip;show()}};
build();
</script></body></html>

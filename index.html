<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cost Accounting – Flashcards</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1b2430;--mut:#6b7785;--pri:#1f3a5f;--acc:#2e75b6;--ok:#2e8b57;--no:#c0392b;--bd:#d5dce4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1c232c;--ink:#e8edf2;--mut:#93a0ad;--pri:#8fb8e8;--acc:#5aa0e0;--ok:#4cc38a;--no:#ff7b6b;--bd:#2f3a46}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1c232c;--ink:#e8edf2;--mut:#93a0ad;--pri:#8fb8e8;--acc:#5aa0e0;--ok:#4cc38a;--no:#ff7b6b;--bd:#2f3a46}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px}
.wrap{width:100%;max-width:760px}
h1{font-size:18px;margin:2px 0 10px;color:var(--pri)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--acc)}button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.prog{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin:6px 0 4px}.prog i{display:block;height:100%;background:var(--ok);width:0}
.meta{color:var(--mut);font-size:13px;display:flex;justify-content:space-between}
.card{margin:12px 0;min-height:340px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.tag{font-size:12px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.q{font-size:18px;font-weight:600;margin:10px 0}.a p{margin:0 0 8px}.hint{color:var(--mut);font-size:13px;margin-top:14px}
.side{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--pri);color:var(--bg);margin-left:8px}
.row{display:flex;gap:8px;justify-content:space-between}.row button{flex:1}
.bad{color:var(--no)}.good{color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
<h1>Cost Accounting (BACC) – 18 review flashcards</h1>
<div class="bar">
<button id="fAll" class="on">Tất cả</button><button id="fRev">Cần ôn lại</button><button id="shuf">Xáo trộn</button><button id="rst">Đặt lại</button>
</div>
<div class="prog"><i id="pb"></i></div>
<div class="meta"><span id="cnt"></span><span id="stat"></span></div>
<div class="card" id="card" tabindex="0" role="button" aria-label="Lật thẻ"></div>
<div class="row"><button id="prev">← Trước</button><button id="no" class="bad">Chưa thuộc</button><button id="ok" class="good">Đã thuộc</button><button id="next">Sau →</button></div>
<p class="hint">Phím tắt: Space/Enter = lật • ← → = chuyển thẻ • 1 = đã thuộc • 2 = chưa thuộc</p>
</div>
<script>
const D=[
[1,"Qualitative factors","1. Please explain the importance of “qualitative factors”. Please use examples to clarify your arguments.",
"Qualitative factors are crucial because management must consider future supply availability and how delayed orders might hurt customer goodwill. They become very important if the business relies on repeat sales but can only obtain a component from a single supplier. In such high-risk situations the financial saving from an outside supplier may not justify the risk.\nExample: in 2016 a supplier stopped delivering gearbox parts and seat covers to Volkswagen. This forced VW to halt production at 6 plants (Passat, Golf) and cut the hours of nearly 28,000 workers.\nSecond example: a special order at a low price may have positive contribution, but regular customers may demand the same discount."],
[2,"Different info for different purposes","2. Why do we say that cost accounting is confusing because different information is required for different purposes? Give an example.",
"There is no single “cost”: the right figure depends on the purpose. (1) Inventory valuation: full manufacturing cost traced to products. (2) Decision-making: only relevant (future, differential) costs. (3) Performance control: costs assigned to the responsible manager.\nExample (XYZ): stock-valuation cost £650 per unit (DM £200 + fixed-salary labour £150 + fixed overhead £300). A customer offers £500 for 100 units. Only DM £200 is relevant, so contribution is £300 × 100 = +£30,000 → accept (if spare capacity)."],
[3,"Functions of cost/management accounting","3. What are the primary functions of cost/management accounting?",
"(1) Inventory valuation for internal and external profit measurement: allocating costs between products sold (P&L) and unsold completed or partly completed products (balance sheet).\n(2) Other calculations for external reporting: allocating costs for accruals and provisions, fixed assets…\n(3) Provide relevant information to help managers make better decisions: planning, controlling and performance measurement – profitability analysis, product pricing, make or buy…"],
[4,"Management vs financial accounting","4. What are the major differences between management accounting and financial accounting?",
"Legal requirement: statutory for financial accounting; none for management accounting.\nFocus: whole business vs parts/segments (products, divisions, customers).\nGAAP: financial accounting must follow GAAP/IFRS; management accounting need not.\nTime dimension and frequency: historic and annual vs frequent (daily/monthly) and future-oriented (budgets, forecasts).\nExtra: users (external vs internal) and level of detail."],
[5,"Relevant information","5. Which information is relevant for decision-making, and which is not necessary? Be specific!",
"Relevant = future costs/revenues that differ between alternatives: incremental revenues and costs, avoidable (direct) fixed costs, opportunity costs.\nAlso needed in the decision process: objectives (profit, ethics), alternative courses of action (quality/cost leader…), data (market share, growth, cash flows, costs), implementation in budgets, plan vs actual reports, corrective action.\nNot necessary: irrelevant information not affected by the decision (sunk costs such as book value and depreciation, allocated fixed overhead that does not change) and outdated data no longer relevant due to changed circumstances.\nExample: materials already bought for £1,000 with no other use are sunk – ignore them."],
[6,"Direct costs and overheads","6. What is the definition of direct costs and overheads? Give 3 concrete examples for direct costs and 3 for overheads.",
"Direct costs can be specifically and exclusively identified with a given cost object.\n• Direct material: milk when producing cheese.\n• Direct labour: wages of workers who directly produce a box of cheese.\n• Direct machine hours: minutes used to produce a box of cheese (cost per minute).\nOverheads (indirect costs) cannot be specifically and exclusively identified with a cost object; they are assigned by cost allocation.\n• Cost of the warehouse: material overhead allocated by percentage.\n• Cost of the repair department: allocated by cost formulas.\n• Factory rent, depreciation of the production building, supervisor salaries."],
[7,"Two-stage allocation","7. What are the main characteristics of the two-stage allocation method? Show them using a graphical overview.",
"Stage 1: overheads are assigned to cost centres (production and service) by direct tracing or first-stage bases (area, book value, employees); service-centre costs are reallocated to production centres.\nStage 2: a separate rate per production centre (budgeted overhead ÷ machine or labour hours); products are charged = rate × usage.\nSteps: (1) assign to centres → (2) reallocate service centres → (3) rate per production centre → (4) assign to products.\nGraph: Overhead items → [Production | Service cost centres] → reallocate → Overhead rate → Products.\nMore accurate than a blanket rate; budgeted rates; traditional bases are volume-based (ABC uses many cause-and-effect drivers)."],
[8,"Cost behaviour","8. (a) Define and (b) give examples: variable cost, fixed cost, semi-variable cost, semi-fixed cost.",
"Variable: total changes in direct proportion to activity; per unit constant. Ex: bicycle frames at £10 (100 units = £1,000; 500 = £5,000).\nFixed: total constant over the relevant range; per unit falls with volume. Ex: a £50,000 tool (£50 per unit at 1,000 units); building depreciation.\nSemi-variable (mixed): fixed part + variable part. Ex: electricity £500 + £0.20 per kWh (10,000 kWh = £2,500).\nSemi-fixed (step): fixed within bands, then jumps. Ex: a tool lasts 5,000 units and costs £50,000 (10,000 units = £100,000)."],
[9,"Absorption costing: pros and cons","9. What are the disadvantages and advantages of absorption costing? Under which circumstances is it particularly beneficial?",
"Advantages: does not understate the importance of fixed costs; avoids fictitious losses (stocks built up for seasonal sales); theoretically superior to variable costing; consistent with external reporting (GAAP).\nDisadvantages: can distort income when production levels fluctuate; less useful for decision-making (fixed overhead looks like a per-unit cost); fixed overheads are capitalised in unsaleable stocks.\nBeneficial: external reporting and tax compliance; seasonal production (fixed costs capitalised into unsold inventory); long-term pricing (price covers all fixed and variable manufacturing costs)."],
[10,"Absorption vs variable costing","10. What is the difference between absorption costing and variable costing? Use the graph to explain.",
"The only difference is the treatment of fixed manufacturing overhead.\nVariable costing: manufacturing cost = material, labour, variable overhead → WIP → finished goods → P&L; fixed overhead → charged directly to the P&L; non-manufacturing costs → P&L.\nAbsorption costing: manufacturing cost = material, labour, all overhead (variable + fixed) → WIP → finished goods → P&L; non-manufacturing costs → P&L.\nProfit difference = change in stock units × fixed overhead rate. Production > sales → absorption profit higher; production < sales → lower; equal → equal."],
[11,"DL, DM, MOH, non-MOH","11. (a) Define and (b) give examples: direct labour, direct material, MOH, non-MOH.",
"Direct labour: labour cost specifically identified with a cost object. Ex: wages of workers who assemble components into finished products.\nDirect material: material cost specifically identified with a cost object. Ex: eggs when producing cakes.\nManufacturing overhead (MOH): indirect costs of the production process that cannot be traced to specific products. Ex: factory rent, electricity, wages of supervisors.\nNon-manufacturing overhead: indirect costs not related to production but supporting overall operations; cannot be traced to specific products. Ex: R&D, selling and marketing costs."],
[12,"Integrated accounting system","12. Draw the graph of the integrated accounting system (systematical overview).",
"Integrated = ONE set of accounts for cost and financial accounting (interlocking = two separate sets, reconciled).\nFlow: Creditors → Stores ledger control → WIP (direct materials) or Factory overhead control (indirect materials). Wages control → WIP (direct) or Factory overhead (indirect). Factory overhead control → WIP (overhead absorbed). WIP → Finished goods → Cost of sales → Costing P&L. Debtors/Sales → P&L. Non-manufacturing overhead and under-/over-recovery → P&L directly.\nCheck (AB Ltd): 400 – 240 – 6 – 40 = profit £114,000."],
[13,"CVP: relevant range",
"13. Explain why it is important to examine the CVP relationship within a relevant range of activity. Is the theoretical model of the CVP relationship the same as the one used in managerial accounting?",
"CVP focuses on short-term activities. In the short run most costs and selling prices are predetermined, while sales volume is the main uncertainty, so CVP shows how changes in sales volume affect costs and profits. Outside the relevant range costs no longer behave linearly (fixed and variable costs change), so CVP predictions become unreliable.\nThe basic CVP framework is the same in economics and management accounting, but the models are not identical: economists use curvilinear functions (2 break-even points, a profit-maximising output); management accounting simplifies to linear functions (1 break-even point) valid within the relevant range, and applies them to short-term decisions such as pricing, break-even and target profit."],
[14,"Operating leverage","14. What is meant by “Company A has higher operating leverage than company B”? How would the outcome differ if sales increase? If sales decrease?",
"Operating leverage measures fixed costs relative to variable costs. A has a higher proportion of fixed costs than B (DOL = contribution ÷ profit).\nSales increase: A’s profit rises by a larger percentage than B’s, because more of each extra £ of revenue falls to profit while fixed costs stay constant (e.g. +10% sales → +70% profit for DOL 7 vs +25% for DOL 2.5).\nSales decrease: A’s profit falls by a larger percentage – fixed costs stay constant while revenue declines. A is riskier."],
[15,"Non-financial information","15. Explain how non-financial information can influence special decisions that are primarily based on financial factors. Give an example.",
"Special decisions (make-or-buy, special order, discontinuation) are analysed with relevant costs, but many factors cannot be quantified. Non-financial (qualitative) factors – supplier reliability, quality, customer goodwill, employee morale – can change or reverse a decision that looks best on the numbers.\nExample: buying a component saves £60,000 a year. But closing the in-house line causes redundancies and low morale, and with only one supplier a delay could hurt customer goodwill. Management may keep making it despite the higher cost.\nThe weight of qualitative factors depends on the situation."],
[16,"Constant sales mix","16. Why is the assumption about constant sales mix important in multi-product CVP analysis?",
"In a multi-product firm, company break-even = total fixed costs ÷ weighted-average contribution per unit. That average depends on the proportion in which products are sold. If the mix is assumed constant, a single break-even point (or “package” of products) can be calculated.\nIf the mix shifts towards lower-contribution products, average contribution falls and break-even volume rises (and vice versa), so break-even and profit forecasts become unreliable.\nExample: mix 2 deluxe : 1 standard → BEP 1,200 units; mix 1 : 2 → about 1,419 units."],
[17,"Limitations of CVP","17. Discuss 2 limitations of CVP analysis when applied to real-world business decisions.",
"1. Linearity (relevant range): CVP assumes constant price, variable cost per unit and fixed costs. In reality discounts, overtime and step-fixed costs make them non-linear. Outside the relevant range the break-even point is wrong.\n2. Constant sales mix: CVP assumes a single product or constant mix. In reality the mix changes, so average contribution and break-even change; the result is only an estimate.\n⇒ CVP is a decision-support tool, not a precise prediction (use sensitivity analysis)."],
[18,"Sales budget","18. Why is the sales budget usually prepared before the other operating budgets? What problems might arise if sales forecasts are inaccurate?",
"Why first: sales demand is normally the principal (limiting) budget factor. Production (= sales + closing stock – opening stock), purchases, labour, overhead, staffing and cash flows all derive from forecast sales. (If capacity or materials are the limiting factor, that budget comes first.)\nProblems: overestimate → overproduction, excess stock, holding costs, cash tied up; underestimate → stock-outs, lost sales, rush costs; cash shortfall; unreliable variances and demotivated managers.\nMitigation: flexible/rolling budgets, sensitivity analysis."]
];
let order=D.map((_,i)=>i),pos=0,flip=false,mark={},filt="all";
try{const s=JSON.parse(localStorage.getItem("ca-fc")||"{}");if(s&&typeof s==="object")mark=s}catch(e){}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem("ca-fc",JSON.stringify(mark))}catch(e){}}
function list(){return order.filter(i=>filt==="all"||mark[D[i][0]]!=="ok")}
function render(){
const L=list(),c=$("card");
const known=D.filter(d=>mark[d[0]]==="ok").length;
$("pb").style.width=(known/D.length*100)+"%";
$("stat").textContent="Đã thuộc "+known+"/"+D.length;
if(!L.length){c.innerHTML='<div class="q">Bạn đã thuộc tất cả thẻ. Nhấn “Đặt lại” để ôn lại.</div>';$("cnt").textContent="0/0";return}
if(pos>=L.length)pos=0;if(pos<0)pos=L.length-1;
const d=D[L[pos]];$("cnt").textContent="Thẻ "+(pos+1)+" / "+L.length;
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const st=mark[d[0]]==="ok"?"✓ đã thuộc":mark[d[0]]==="no"?"cần ôn":"";
c.innerHTML='<div class="tag">Câu '+d[0]+' · '+esc(d[1])+(st?'<span class="side">'+st+'</span>':'')+'</div>'+
(flip?'<div class="a" style="margin-top:10px">'+d[3].split("\n").map(p=>"<p>"+esc(p)+"</p>").join("")+'</div><div class="hint">Nhấn để xem câu hỏi</div>'
:'<div class="q">'+esc(d[2])+'</div><div class="hint">Nhấn để xem đáp án</div>')}
function go(n){pos+=n;flip=false;render()}
function setM(v){const L=list();if(!L.length)return;mark[D[L[pos]][0]]=v;save();if(filt==="rev"&&v==="ok"){flip=false;render()}else go(1)}
$("card").onclick=()=>{flip=!flip;render()};
$("next").onclick=()=>go(1);$("prev").onclick=()=>go(-1);
$("ok").onclick=()=>setM("ok");$("no").onclick=()=>setM("no");
$("shuf").onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;flip=false;render()};
$("rst").onclick=()=>{mark={};save();order=D.map((_,i)=>i);pos=0;flip=false;filt="all";$("fAll").className="on";$("fRev").className="";render()};
$("fAll").onclick=()=>{filt="all";pos=0;flip=false;$("fAll").className="on";$("fRev").className="";render()};
$("fRev").onclick=()=>{filt="rev";pos=0;flip=false;$("fRev").className="on";$("fAll").className="";render()};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);else if(e.key===" "||e.key==="Enter"){e.preventDefault();flip=!flip;render()}else if(e.key==="1")setM("ok");else if(e.key==="2")setM("no")});
render();
</script>
</body>
</html>
